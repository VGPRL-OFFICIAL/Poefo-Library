<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="../images/Logo_Poefo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style/login_cadastro.css">
    <link rel="stylesheet" href="../style/style_theme.css">
    <script src="../scripts/theme.js"></script>


    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="../scripts/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-functions.js"></script>
    <script src="../scripts/auth-profile.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link para o Manifest -->
    <link rel="manifest" href="../scripts/manifest.json">
    <!-- Cor da barra de navegação no mobile -->
    <meta name="theme-color" content="#777777">
    <!-- Suporte e Ícone para iOS (Safari) -->
    <link rel="apple-touch-icon" href="../images/icon_logo_192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>

    <div class="login-container">

        <div class="icon-area">
            <div class="icon-circle">
                <img src="../images/Logo_Poefo.png" alt="Logo Poefo" class="logo">
            </div>
        </div>

        <h1>Login</h1>

        <form id="loginForm">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="E-mail ou nome de usuário" id="usuario" required autocomplete="username">
            </div>

            <div class="input-group password-group"> <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Senha" id="senha" required autocomplete="current-password">
                <button type="button" class="toggle-password" id="togglePassword">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            <div class="login-form-actions">
                <button type="button" id="btn-esqueci-senha" class="forgot-password">Esqueci a senha</button>
            </div>

            <label class="privacy-consent">
                <input type="checkbox" id="privacy-consent">
                <span>Li e aceito a <a href="/privacidade?retorno=/login">Política de Privacidade</a>.</span>
            </label>

         <!-- <div class="remember-me-group">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Lembrar Login</label>
            </div> -->

            <p id="feedback"
                style="color: var(--secondary-color); text-align: center; margin-bottom: 15px; font-weight: 600;"></p>

            <button type="submit" id="btn-entrar" class="btn-primary">Entrar</button>
        </form>

        <button type="button" id="btn-google" class="btn-google">
            <i class="fa-brands fa-google" aria-hidden="true"></i>
            <span>Continuar com Google</span>
        </button>
        <p id="auth-feedback" role="status" aria-live="polite" class="auth-feedback"></p>
        <a href="/cadastro" class="criaracont">Não possui login ?/ Criar Conta</a> <i
            class="fa-solid fa-square-code watermark-icon"></i>
    </div>

    <script>

        if (!firebase.apps.length) {
            firebase.initializeApp(window.POEFO_FIREBASE_CONFIG);
        }
        const auth = firebase.auth();
        const persistenceReady = auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const usuarioInput = document.getElementById('usuario');
            const senhaInput = document.getElementById('senha');
            const rememberMeCheckbox = document.getElementById('remember-me');
            const feedback = document.getElementById('feedback');
            const btnEntrar = document.getElementById('btn-entrar');
            const btnGoogle = document.getElementById('btn-google');
            const btnForgotPassword = document.getElementById('btn-esqueci-senha');
            const authFeedback = document.getElementById('auth-feedback');
            const privacyConsentCheckbox = document.getElementById('privacy-consent');
            const googleSignupStorageKey = 'poefoGoogleSignup';
            const privacyConsentStorageKey = 'poefoPrivacyConsentPending';
            let authFlowInProgress = false;

            if (sessionStorage.getItem(privacyConsentStorageKey) === PoefoAuthProfile.PRIVACY_POLICY_VERSION) {
                privacyConsentCheckbox.checked = true;
            }

            // Aqui eu controlo o botão que mostra ou oculta a senha.
            const togglePasswordButton = document.getElementById('togglePassword');
            togglePasswordButton.addEventListener('click', () => {
                const type = senhaInput.getAttribute('type') === 'password' ? 'text' : 'password';
                senhaInput.setAttribute('type', type);
                // Altera o ícone do olho
                togglePasswordButton.querySelector('i').classList.toggle('fa-eye');
                togglePasswordButton.querySelector('i').classList.toggle('fa-eye-slash');
            });

            function loadSavedLogin() {
                const savedUsername = localStorage.getItem('rememberedUsername');
                if (savedUsername) {
                    usuarioInput.value = savedUsername;
                    if (rememberMeCheckbox) rememberMeCheckbox.checked = true;
                    senhaInput.focus();
                }
            }

            loadSavedLogin();

            function requirePrivacyAcceptance(profile) {
                if (!PoefoAuthProfile.hasCurrentPrivacyConsent(profile) && !privacyConsentCheckbox.checked) {
                    throw new Error('Para entrar, aceite a Política de Privacidade.');
                }
            }

            async function completeLogin(authUser, profile) {
                if (profile.data.bloqueado === true) {
                    await auth.signOut();
                    throw new Error('Esta conta está bloqueada. Entre em contato com a administração.');
                }

                requirePrivacyAcceptance(profile);
                profile = await PoefoAuthProfile.attachAuthUser(profile, authUser);
                if (!PoefoAuthProfile.hasCurrentPrivacyConsent(profile)) {
                    profile = await PoefoAuthProfile.savePrivacyConsent(profile, 'login');
                }
                sessionStorage.removeItem(privacyConsentStorageKey);
                PoefoAuthProfile.saveSession(profile, authUser);
                if (rememberMeCheckbox?.checked) {
                    localStorage.setItem('rememberedUsername', profile.data.nome_usuario || authUser.email);
                } else if (rememberMeCheckbox) {
                    localStorage.removeItem('rememberedUsername');
                }
                feedback.textContent = `Login efetuado como ${profile.data.nome_usuario || authUser.email}! Redirecionando...`;
                window.setTimeout(() => {
                    const permissionsKey = `poefoPermissionsSetup_v1_${authUser.uid}`;
                    window.location.href = localStorage.getItem(permissionsKey) === 'done'
                        ? '/carregando'
                        : '/permissoes?next=%2Fcarregando';
                }, 800);
            }

            function isInvalidCredentialsError(error) {
                return [
                    'auth/user-not-found',
                    'auth/invalid-credential',
                    'auth/invalid-login-credentials'
                ].includes(error.code)
                    || String(error.message || '').includes('INVALID_LOGIN_CREDENTIALS');
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                btnEntrar.disabled = true;
                feedback.textContent = 'Verificando credenciais...';

                const enteredUsername = usuarioInput.value.trim().toLowerCase();
                const enteredPassword = senhaInput.value;

                if (!enteredUsername || !enteredPassword) {
                    feedback.textContent = '❌ Por favor, preencha todos os campos.';
                    btnEntrar.disabled = false;
                    return;
                }

                authFlowInProgress = true;
                try {
                    await persistenceReady;
                    let profile = null;
                    let email = enteredUsername;
                    if (!enteredUsername.includes('@')) {
                        profile = await PoefoAuthProfile.findByLogin(enteredUsername);
                        if (!profile) throw new Error('Usuário não encontrado.');
                        if (profile.data.bloqueado === true) {
                            throw new Error('Esta conta está bloqueada. Entre em contato com a administração.');
                        }
                        email = profile.data.email;
                    } else {
                        profile = await PoefoAuthProfile.findByEmail(email);
                    }

                    if (!email || !email.includes('@')) {
                        throw new Error('Esta conta não possui um e-mail válido vinculado.');
                    }
                    requirePrivacyAcceptance(profile);

                    try {
                        const credential = await auth.signInWithEmailAndPassword(email, enteredPassword);
                        profile = profile || await PoefoAuthProfile.findByEmail(credential.user.email);
                        profile = profile || await PoefoAuthProfile.createProfileForAuthUser(credential.user);
                        await completeLogin(credential.user, profile);
                    } catch (authError) {
                        if (!isInvalidCredentialsError(authError)) throw authError;
                        profile = profile || await PoefoAuthProfile.findByEmail(email);
                        if (!profile || profile.data.senha == null || String(profile.data.senha) !== enteredPassword) {
                            throw new Error('E-mail ou senha incorretos. Confira os dados ou use “Esqueci a senha”.');
                        }
                        if (profile.data.bloqueado === true) {
                            throw new Error('Esta conta está bloqueada. Entre em contato com a administração.');
                        }

                        try {
                            const credential = await auth.createUserWithEmailAndPassword(email, enteredPassword);
                            await completeLogin(credential.user, profile);
                        } catch (migrationError) {
                            if (migrationError.code !== 'auth/email-already-in-use') throw migrationError;
                            await auth.sendPasswordResetEmail(email);
                            throw new Error('Esta conta já está vinculada ao Firebase. Enviamos um link para redefinir a senha e concluir o acesso.');
                        }
                    }
                } catch (error) {
                    console.error("Erro no Login:", error);
                    feedback.textContent = `❌ ${error.message || 'Não foi possível entrar. Verifique suas credenciais.'}`;
                    if (auth.currentUser && feedback.textContent.indexOf('Redirecionando') === -1) {
                        try {
                            await auth.signOut();
                        } catch (signOutError) {
                            console.error('Não foi possível encerrar a sessão após falha no login:', signOutError);
                        }
                    }
                }

                if (feedback.textContent.indexOf('Redirecionando') === -1) {
                    authFlowInProgress = false;
                    btnEntrar.disabled = false;
                }
            });

            btnGoogle.addEventListener('click', async () => {
                btnGoogle.disabled = true;
                authFlowInProgress = true;
                authFeedback.textContent = 'Conectando com o Google...';
                try {
                    await persistenceReady;
                    const provider = new firebase.auth.GoogleAuthProvider();
                    let googleIdToken;
                    try {
                        const signInResult = await auth.signInWithPopup(provider);
                        const googleCredential = typeof firebase.auth.GoogleAuthProvider.credentialFromResult === 'function'
                            ? firebase.auth.GoogleAuthProvider.credentialFromResult(signInResult)
                            : signInResult.credential;
                        googleIdToken = googleCredential?.idToken;
                    } catch (popupError) {
                        googleIdToken = popupError?.credential?.idToken;
                        if (!googleIdToken) throw popupError;
                    }

                    if (!googleIdToken) {
                        throw new Error('O Google não retornou um token de identidade válido.');
                    }

                    const loginWithGoogleIdentity = firebase.functions().httpsCallable('loginWithGoogleIdentity');
                    const response = await loginWithGoogleIdentity({ idToken: googleIdToken });
                    const googleLogin = response.data;
                    if (!googleLogin?.token || !googleLogin.email || !googleLogin.fullName) {
                        throw new Error('O servidor não retornou os dados necessários para concluir o login.');
                    }

                    if (googleLogin.profileExists) {
                        const existingProfile = await PoefoAuthProfile.findByEmail(googleLogin.email);
                        requirePrivacyAcceptance(existingProfile);
                    }

                    const authCredential = await auth.signInWithCustomToken(googleLogin.token);
                    if (!googleLogin.profileExists) {
                        sessionStorage.setItem(googleSignupStorageKey, JSON.stringify({
                            email: googleLogin.email,
                            fullName: googleLogin.fullName
                        }));
                        authFeedback.textContent = 'E-mail não cadastrado. Continue criando sua conta Poefo...';
                        window.location.href = '/cadastro';
                        return;
                    }

                    let profile = await PoefoAuthProfile.findByAuthUid(authCredential.user.uid);
                    profile = profile || await PoefoAuthProfile.findByEmail(googleLogin.email);
                    if (!profile) {
                        throw new Error('O perfil Poefo não foi encontrado após a validação. Tente novamente.');
                    }
                    authFeedback.textContent = 'Login efetuado. Redirecionando...';
                    await completeLogin(authCredential.user, profile);
                } catch (error) {
                    console.error('Erro no login com Google:', error);
                    authFeedback.textContent = `Não foi possível entrar com Google: ${error.message || 'Tente novamente.'}`;
                    if (auth.currentUser) {
                        try {
                            await auth.signOut();
                        } catch (signOutError) {
                            console.error('Não foi possível encerrar a sessão Google após falha:', signOutError);
                        }
                    }
                } finally {
                    authFlowInProgress = false;
                    btnGoogle.disabled = false;
                }
            });

            btnForgotPassword.addEventListener('click', async () => {
                const identifier = usuarioInput.value.trim();
                if (!identifier) {
                    authFeedback.textContent = 'Informe seu e-mail ou nome de usuário para receber o link de recuperação.';
                    usuarioInput.focus();
                    return;
                }

                btnForgotPassword.disabled = true;
                try {
                    const profile = identifier.includes('@') ? null : await PoefoAuthProfile.findByLogin(identifier);
                    const email = identifier.includes('@') ? identifier : profile?.data.email || '';
                    if (!email) throw new Error('Não encontramos um e-mail vinculado a esse nome de usuário.');
                    await auth.sendPasswordResetEmail(email);
                    authFeedback.textContent = 'Se houver uma conta com esse e-mail, o link de recuperação será enviado.';
                } catch (error) {
                    console.error('Erro ao solicitar recuperação de senha:', error);
                    authFeedback.textContent = `Não foi possível enviar o link de recuperação: ${error.message}`;
                } finally {
                    btnForgotPassword.disabled = false;
                }
            });

            auth.onAuthStateChanged(async (authUser) => {
                if (!authUser || authFlowInProgress) return;
                try {
                    await persistenceReady;
                    const profile = await PoefoAuthProfile.findByAuthUid(authUser.uid);
                    if (!profile || !PoefoAuthProfile.hasCurrentPrivacyConsent(profile)) {
                        await auth.signOut();
                        feedback.textContent = 'Antes de continuar, aceite a Política de Privacidade.';
                        return;
                    }
                    PoefoAuthProfile.saveSession(profile, authUser);
                    const permissionsKey = `poefoPermissionsSetup_v1_${authUser.uid}`;
                    window.location.replace(localStorage.getItem(permissionsKey) === 'done'
                        ? '/inicio'
                        : '/permissoes?next=%2Finicio');
                } catch (error) {
                    console.error('Não foi possível verificar a sessão persistente:', error);
                    authFeedback.textContent = `Não foi possível verificar sua sessão: ${error.message}`;
                }
            });
        });


        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .then((reg) => console.log('Service Worker registrado com sucesso!'))
                    .catch((err) => console.log('Erro ao registrar Service Worker:', err));
            });
        }

    </script>

</body>

</html>
