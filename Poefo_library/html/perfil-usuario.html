<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Perfil</title>
    
    <link rel="stylesheet" href="../style/style_perfil.css">
    <link rel="stylesheet" href="../style/style_theme.css">
    <script src="../scripts/theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

    <div class="app-screen">
        
        <header class="app-top-bar">
            <button onclick="history.back()" class="back-btn" style="background: none; border: none; cursor: pointer;">
                <i class="fas fa-arrow-left"></i>
            </button>
        </header>

        
        <div id="profile-main">
            <div class="post-item placeholder">
                <span>Carregando Perfil...</span>
            </div>
        </div>
    </div>

    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="../scripts/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
    <script>
        if (!firebase.apps.length) firebase.initializeApp(window.POEFO_FIREBASE_CONFIG);
        const db = firebase.database();

        const ALL_POSTS_DATA_URL = 'https://firebasestorage.googleapis.com/v0/b/captu-libraly.firebasestorage.app/o/livros_json%2Fposts.json?alt=media&token=e7b7b6fb-275a-45e3-9482-7830189c671f';

        // Aqui eu trato as leituras do perfil sem ocultar erros inesperados.
        async function safeReadRef(path) {
            try {
                const snap = await db.ref(path).once('value');
                return snap.exists() ? snap.val() : null;
            } catch (err) {
                if (err && (err.code === 'PERMISSION_DENIED' || (err.message && err.message.toLowerCase().includes('permission')))) {
                    console.warn('Permissão negada ao ler', path);
                    return null;
                }
                console.error('Erro ao ler RTDB:', path, err);
                return null;
            }
        }

        async function readRelationshipCount(path) {
            try {
                const snapshot = await db.ref(path).once('value');
                const relationships = snapshot.val() || {};
                return Object.values(relationships).filter(isFollowing => isFollowing === true).length;
            } catch (error) {
                console.warn(`Não foi possível carregar a contagem em ${path}:`, error);
                return null;
            }
        }

        function formatReadingDuration(totalSeconds) {
            const totalMinutes = Math.floor(Math.max(0, Number(totalSeconds) || 0) / 60);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            if (hours === 0) return `${minutes} min`;
            return minutes ? `${hours}h ${minutes}min` : `${hours}h`;
        }

        function waitForAuthUser() {
            const auth = firebase.auth();
            if (auth.currentUser) return Promise.resolve(auth.currentUser);

            return new Promise((resolve, reject) => {
                let unsubscribe = () => {};
                unsubscribe = auth.onAuthStateChanged(
                    user => {
                        unsubscribe();
                        resolve(user);
                    },
                    error => {
                        unsubscribe();
                        reject(error);
                    }
                );
            });
        }

        async function resolveViewerProfileId(authUser) {
            const storedProfileId = sessionStorage.getItem('currentUserId')
                || localStorage.getItem('currentUserId');
            const storedAuthUid = sessionStorage.getItem('currentUserAuthUid')
                || localStorage.getItem('currentUserAuthUid');
            if (storedProfileId && storedAuthUid === authUser.uid) return storedProfileId;

            const profiles = await db.ref('usuarios')
                .orderByChild('authUid')
                .equalTo(authUser.uid)
                .limitToFirst(1)
                .once('value');
            const profileId = Object.keys(profiles.val() || {})[0];
            if (!profileId) throw new Error('Não encontramos um perfil vinculado à sua conta. Entre novamente.');
            return profileId;
        }

        function updateFollowStats(result, button) {
            button.textContent = result.following ? 'Seguindo' : 'Seguir';
            const followersCount = document.getElementById('stat-followers');
            if (followersCount && Number.isFinite(result.followersCount)) {
                followersCount.textContent = result.followersCount;
            }
            const followingCount = document.getElementById('stat-following');
            if (followingCount && Number.isFinite(result.followingCount)) {
                followingCount.textContent = result.followingCount;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            let targetUid = urlParams.get('uid');
            if (!targetUid) targetUid = sessionStorage.getItem('viewUserId') || null;
            const profileMain = document.getElementById('profile-main');

            if (!targetUid || targetUid === 'USER_ANONIMO') {
                profileMain.innerHTML = `<div class="post-item placeholder"><span>Erro: Perfil não encontrado ou inválido.</span></div>`;
                return;
            }

            try {
                const userVal = await safeReadRef(`usuarios/${targetUid}`);
                const data = userVal || null;
                if (!data) {
                    profileMain.innerHTML = `<div class="post-item placeholder"><span>Perfil não encontrado no banco de dados.</span></div>`;
                    return;
                }

                const viewerUid = sessionStorage.getItem('currentUserId')
                    || localStorage.getItem('currentUserId')
                    || null;
                const isOwnProfile = viewerUid && viewerUid === String(targetUid);

                const [totalFollowers, totalFollowing] = await Promise.all([
                    readRelationshipCount(`followers/${targetUid}`),
                    readRelationshipCount(`follows/${targetUid}`)
                ]);

                const followBtnText = 'Seguir';
                const score = Math.max(0, Number(data.pontuacao_total) || 0);
                const readingDuration = formatReadingDuration(data.horas_lidas_segundos);

                // Renderiza o novo esqueleto estético baseado no arquivo style_perfil.css
                const profileHtml = `
                    <div class="perfil-card-container">
                        <section class="perfil-header-block">
                            <div class="foto-perfil-wrapper">
                                <div class="foto-perfil">
                                    <img src="${data.foto_perfil || '../images/user_ic.png'}" alt="Foto de Perfil">
                                </div>
                            </div>
                            <div class="info-usuario-bloco">
                                <h1 class="display-nome">${data.nome_completo || 'Sem Nome'}</h1>
                                <p class="display-username">@${data.nome_usuario || targetUid}</p>
                                <p class="display-localizacao"><i class="fas fa-info-circle"></i> <span id="user-bio">${data.bio || 'Sem biografia disponível.'}</span></p>
                            </div>
                        </section>

                        
                        <section class="estatisticas-container perfil-social-stats" aria-label="Estatísticas do perfil">
                            <div class="stat-box">
                                <span class="stat-numero" id="stat-posts">0</span>
                                <span class="stat-label">Posts</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-numero" id="stat-likes">0</span>
                                <span class="stat-label">Curtidas</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-numero" id="stat-followers">${totalFollowers === null ? '—' : totalFollowers.toLocaleString('pt-BR')}</span>
                                <span class="stat-label">Seguidores</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-numero" id="stat-following">${totalFollowing === null ? '—' : totalFollowing.toLocaleString('pt-BR')}</span>
                                <span class="stat-label">Seguindo</span>
                            </div>
                        </section>

                        <section class="botoes-acao-wrapper">
                            ${isOwnProfile ?
                                `<button id="btn-editar" class="btn-gradiente btn-follow">Seu Perfil</button>` :
                                `<button id="btn-seguir" class="btn-gradiente btn-follow">${followBtnText}</button>
                                 <button id="btn-mensagem" class="btn-gradiente btn-message">Mensagem</button>`
                            }
                        </section>

                        <section class="perfil-progress-section" aria-label="Progresso de leitura">
                            <div class="perfil-progress-heading">
                                <span class="perfil-progress-eyebrow">JORNADA DE LEITURA</span>
                                <h2>Progresso</h2>
                            </div>
                            <div class="perfil-progress-grid">
                                <article class="perfil-progress-card perfil-progress-card--time">
                                    <span class="perfil-progress-icon" aria-hidden="true"><i class="fas fa-book-open"></i></span>
                                    <div class="perfil-progress-copy">
                                        <span class="perfil-progress-label">Tempo de leitura</span>
                                        <strong class="perfil-progress-value" id="stat-hours">${readingDuration}</strong>
                                        <span class="perfil-progress-note">Tempo total na plataforma</span>
                                    </div>
                                </article>
                                <article class="perfil-progress-card perfil-progress-card--score">
                                    <span class="perfil-progress-icon" aria-hidden="true"><i class="fas fa-star"></i></span>
                                    <div class="perfil-progress-copy">
                                        <span class="perfil-progress-label">Pontos acumulados</span>
                                        <strong class="perfil-progress-value" id="stat-score">${score.toLocaleString('pt-BR')}</strong>
                                        <span class="perfil-progress-note">Evolução no Poefo</span>
                                    </div>
                                </article>
                            </div>
                        </section>

                        <nav class="nav-abas-perfil">
                            <a href="#" class="aba-item ativo">Publicações</a>
                        </nav>

                        <main class="grid-galeria-posts" id="public-posts-grid">
                            <div class="post-item placeholder"><span>Carregando publicações...</span></div>
                        </main>
                    </div>
                `;

                profileMain.innerHTML = profileHtml;

                // Configura o botão próprio de redirecionamento ou ativa os listeners
                if (isOwnProfile) {
                    const btnEdit = document.getElementById('btn-editar');
                    btnEdit && btnEdit.addEventListener('click', () => {
                        window.location.href = '/perfil';
                    });
                }

                if (!isOwnProfile) {
                    const btn = document.getElementById('btn-seguir');
                    if (btn) {
                        const getFollowStatus = async () => {
                            const authUser = await waitForAuthUser();
                            if (!authUser) return null;
                            const followerId = await resolveViewerProfileId(authUser);
                            const response = await firebase.functions().httpsCallable('getFollowStatus')({
                                followerUserId: followerId,
                                targetUserId: String(targetUid)
                            });
                            return { followerId, ...response.data };
                        };

                        getFollowStatus().then(status => {
                            if (status) updateFollowStats(status, btn);
                        }).catch(error => {
                            console.warn('Não foi possível carregar o estado do seguimento:', error);
                        });

                        btn.addEventListener('click', async () => {
                            try {
                                btn.disabled = true;
                                const status = await getFollowStatus();
                                if (!status) {
                                    throw new Error('Entre na sua conta para seguir este perfil.');
                                }
                                const response = await firebase.functions().httpsCallable('toggleFollow')({
                                    followerUserId: status.followerId,
                                    targetUserId: String(targetUid),
                                    following: !status.following
                                });
                                updateFollowStats(response.data, btn);
                            } catch (err) {
                                console.error('Erro ao atualizar seguimento:', err);
                                const detail = err.message || 'Verifique sua conexão e tente novamente.';
                                alert(`Não foi possível atualizar o seguimento: ${detail}`);
                            } finally {
                                btn.disabled = false;
                            }
                        });
                    }

                }

                if (!isOwnProfile && viewerUid) {
                    const msgBtn = document.getElementById('btn-mensagem');
                    msgBtn && msgBtn.addEventListener('click', () => {
                        sessionStorage.setItem('chatWithUserId', targetUid);
                        sessionStorage.setItem('chatWithUserName', data.nome_usuario || data.nome_completo || targetUid);
                        window.location.href = '/chat';
                    });
                }

                // Renderização dinâmica do feed de posts filtrado por ID
                const postsResp = await fetch(ALL_POSTS_DATA_URL);
                const posts = postsResp.ok ? await postsResp.json().catch(() => []) : [];
                const userPosts = posts.filter(p => {
                    if (!p) return false;
                    return (p.userId && String(p.userId) === String(targetUid)) ||
                           (p.author && p.author.userId && String(p.author.userId) === String(targetUid)) ||
                           (p.autor && p.autor.userId && String(p.autor.userId) === String(targetUid));
                });

                const grid = document.getElementById('public-posts-grid');
                grid.innerHTML = '';
                
                const statPostsEl = document.getElementById('stat-posts');
                if (statPostsEl) statPostsEl.textContent = userPosts.length;

                let totalLikes = 0;
                userPosts.forEach(pp => {
                    const l = pp.likes || pp.Curtidas || pp.likesCount || pp.likes_count || 0;
                    totalLikes += (typeof l === 'number') ? l : (parseInt(l) || 0);
                });
                
                const likesEl = document.getElementById('stat-likes');
                if (likesEl) likesEl.textContent = totalLikes;

                if (userPosts.length === 0) {
                    grid.innerHTML = '<div class="post-item placeholder"><span>Sem publicações.</span></div>';
                } else {
                    userPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).forEach(p => {
                        const el = document.createElement('div');
                        el.className = 'post-card-item';
                        
                        const imgUrl = (p.attachment && p.attachment.url) ? p.attachment.url : (p.anexo_url ? p.anexo_url : null);
                        
                        if (imgUrl) {
                            el.innerHTML = `<img src="${imgUrl}" class="post-img-content" alt="Mídia">`;
                        } else {
                            const text = p.content || p.conteudo || p.texto || p.titulo || '';
                            el.innerHTML = `<div class="post-text-card">${text.substring(0, 100)}</div>`;
                        }
                        grid.appendChild(el);
                    });
                }

            } catch (err) {
                console.error('Erro ao carregar perfil:', err);
                profileMain.innerHTML = `<div class="post-item placeholder"><span>Erro ao carregar informações.</span></div>`;
            }
        });
    </script>
</body>

</html>
