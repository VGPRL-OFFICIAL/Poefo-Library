<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Poefo</title>
    <link rel="icon" href="../images/Logo_Poefo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style/login_cadastro.css">
    <link rel="stylesheet" href="../style/style_theme.css">
    <script src="../scripts/theme.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="../scripts/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="../scripts/auth-profile.js"></script>
</head>
<body>

    <div class="Cadastro-container">
        
        <div class="icon-area">
            <div class="icon-circle">
                <img src="../images/Logo_Poefo.png" alt="Logo Poefo" class="logo">
            </div>
        </div>
        
        <h1>Criar</h1>

        <form id="cadastroForm">
            
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Email" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" id="nome_completo" placeholder="Nome Completo" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="nome_usuario" placeholder="Nome de Usuário" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="senha" placeholder="Senha" required>
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirmar_senha" placeholder="Confirmar Senha" required>
            </div>

            <div class="input-group foto-perfil-upload">
                <i class="fa-solid fa-camera"></i>
                <label for="foto_perfil" id="file-label" class="file-label-text">Selecionar Foto de Perfil (Opcional)</label>
                <input type="file" id="foto_perfil" accept="image/*"> 
            </div>

            <label class="privacy-consent">
                <input type="checkbox" id="privacy-consent" required>
                <span>Li e aceito a <a href="/privacidade?retorno=/cadastro">Política de Privacidade</a>.</span>
            </label>
            
            <p id="feedback" style="color: var(--secondary-color); text-align: center; margin-bottom: 15px; font-weight: 600;"></p>
            
            <button type="submit" class="btn-criar btn-primary">Cadastrar</button>
            <a href="javascript:history.back()" class="criaracont">Já possui login ?/ Entrar</a> <i class="fa-solid fa-square-code watermark-icon"></i>
        </form>

        <i class="fa-solid fa-square-code watermark-icon"></i>
    </div>
    
    <script>
        if (!firebase.apps.length) {
            firebase.initializeApp(window.POEFO_FIREBASE_CONFIG);
        }
        const persistenceReady = firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        // Inicializa o Storage (para a foto de perfil)
        const storage = firebase.storage();
        const storageRef = storage.ref();
        
        // Aqui eu inicializo o Realtime Database.
        const database = firebase.database();

        // Caminhos
        const PROFILE_IMAGES_FOLDER = "captu-libraly/profile_images/";
        // URL de imagem padrão
        const DEFAULT_PROFILE_PIC = 'https://firebasestorage.googleapis.com/v0/b/captu-libraly.appspot.com/o/default_profile.png?alt=media'; // Use sua URL de imagem padrão

        
        const form = document.getElementById('cadastroForm');
        const feedback = document.getElementById('feedback');
        const inputFoto = document.getElementById('foto_perfil');
        const labelFoto = document.getElementById('file-label');
        const googleSignupStorageKey = 'poefoGoogleSignup';
        const privacyConsentStorageKey = 'poefoPrivacyConsentPending';
        const privacyConsentCheckbox = document.getElementById('privacy-consent');
        const googleSignupData = sessionStorage.getItem(googleSignupStorageKey);
        let pendingGoogleSignup = null;

        if (sessionStorage.getItem(privacyConsentStorageKey) === PoefoAuthProfile.PRIVACY_POLICY_VERSION) {
            privacyConsentCheckbox.checked = true;
        }

        if (googleSignupData) {
            try {
                pendingGoogleSignup = JSON.parse(googleSignupData);
                if (!pendingGoogleSignup?.email || !pendingGoogleSignup?.fullName) {
                    throw new Error('Os dados recebidos do Google estão incompletos.');
                }
                document.getElementById('email').value = pendingGoogleSignup.email;
                document.getElementById('email').readOnly = true;
                document.getElementById('nome_completo').value = pendingGoogleSignup.fullName;
                document.getElementById('nome_completo').readOnly = true;
                document.getElementById('nome_usuario').value = pendingGoogleSignup.fullName
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .toLowerCase()
                    .replace(/[^a-z0-9._-]/g, '')
                    .slice(0, 24) || 'leitor';
                feedback.textContent = 'Dados do Google preenchidos. Crie sua senha Poefo para concluir o cadastro.';
            } catch (error) {
                console.error('Não foi possível carregar os dados Google para o cadastro:', error);
                pendingGoogleSignup = null;
                sessionStorage.removeItem(googleSignupStorageKey);
                feedback.textContent = 'Não foi possível validar os dados do Google. Inicie o cadastro novamente pelo login.';
            }
        }

        // Adiciona funcionalidade de clique à label do campo de arquivo
        labelFoto.addEventListener('click', () => {
             inputFoto.click();
        });


        // Listener para atualizar o label do input file ao selecionar uma imagem
        inputFoto.addEventListener('change', () => {
            if (inputFoto.files.length > 0) {
                // Remove o texto "Opcional" e exibe o nome do arquivo
                labelFoto.textContent = `Selecionado: ${inputFoto.files[0].name}`;
                labelFoto.style.color = 'var(--primary-color)';
            } else {
                labelFoto.textContent = 'Selecionar Foto de Perfil (Opcional)';
                labelFoto.style.color = 'var(--text-medium)';
            }
        });

        /**
         * Realiza o upload da imagem para o Firebase Storage.
         */
        async function uploadImage(file, userName) {
            // Cria um nome de arquivo único usando timestamp e nome de usuário
            const fileExtension = file.name.split('.').pop();
            const fileName = `${userName}_${Date.now()}.${fileExtension}`;
            // Adaptação: Usamos o nome do bucket do config
            const imageRef = storage.ref(`${PROFILE_IMAGES_FOLDER}${fileName}`);

            feedback.textContent = `Fazendo upload da foto de perfil: ${file.name}...`;
            
            const snapshot = await imageRef.put(file);
            const downloadURL = await snapshot.ref.getDownloadURL();
            
            return downloadURL;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Desativa o botão para evitar cliques múltiplos
            const btnCadastro = form.querySelector('.btn-criar[type="submit"]');
            btnCadastro.disabled = true;
            feedback.textContent = 'Iniciando cadastro...';
            
            const file = inputFoto.files[0];
            const email = document.getElementById('email').value.trim().toLowerCase();
            const nome_completo = document.getElementById('nome_completo').value.trim();
            // Normaliza o nome de usuário para minúsculas para uma verificação de duplicidade mais robusta
            const nome_usuario = document.getElementById('nome_usuario').value.trim().toLowerCase(); 
            const senha = document.getElementById('senha').value;
            const confirmar_senha = document.getElementById('confirmar_senha').value;
            let foto_url = DEFAULT_PROFILE_PIC;
            const googleAuthUser = firebase.auth().currentUser;
            const isGoogleSignup = Boolean(pendingGoogleSignup);

            if (!privacyConsentCheckbox.checked) {
                feedback.textContent = 'Para criar sua conta, aceite a Política de Privacidade.';
                btnCadastro.disabled = false;
                return;
            }
            
            if (senha !== confirmar_senha) {
                feedback.textContent = '❌ Erro: A senha e a confirmação de senha não coincidem!';
                btnCadastro.disabled = false;
                return;
            }

            try {
                await persistenceReady;
                if (isGoogleSignup) {
                    const normalizeIdentity = value => String(value || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('pt-BR');
                    const tokenResult = googleAuthUser && await googleAuthUser.getIdTokenResult();
                    const googleIdentity = tokenResult?.claims;
                    if (!googleAuthUser
                        || googleIdentity?.poefoGoogleProfileExists !== false
                        || googleIdentity?.poefoGoogleEmail !== pendingGoogleSignup.email
                        || normalizeIdentity(googleIdentity?.poefoGoogleFullName) !== normalizeIdentity(pendingGoogleSignup.fullName)
                        || email !== pendingGoogleSignup.email
                        || normalizeIdentity(nome_completo) !== normalizeIdentity(pendingGoogleSignup.fullName)) {
                        throw new Error('A sessão Google expirou ou os dados de identidade não correspondem. Inicie novamente pelo login.');
                    }
                    if (await PoefoAuthProfile.findByEmail(email)) {
                        throw new Error('Já existe um perfil Poefo para este e-mail. Entre pelo login.');
                    }
                    foto_url = googleAuthUser.photoURL || foto_url;
                }

                // 1. VERIFICAÇÃO DE DUPLICIDADE NO RTDB
                feedback.textContent = 'Verificando duplicidade de Nome de Usuário...';
                
                // Consulta no RTDB: Busca um usuário com o 'nome_usuario' fornecido.
                // Esta consulta é case-insensitive, desde que salvemos em minúsculas
                const userSnapshot = await database.ref('usuarios')
                    .orderByChild('nome_usuario')
                    .equalTo(nome_usuario)
                    .once('value'); // Usa 'once' para obter os dados uma vez
                
                if (userSnapshot.exists()) {
                    feedback.textContent = '⚠️ Erro: Já existe um perfil com este Nome de Usuário.';
                    btnCadastro.disabled = false;
                    return;
                }

                // 2. UPLOAD DA IMAGEM (SE HOUVER)
                if (file) {
                    foto_url = await uploadImage(file, nome_usuario);
                }

                feedback.textContent = 'Criando sua conta protegida...';
                let credential;
                if (isGoogleSignup) {
                    const hasPasswordProvider = googleAuthUser.providerData.some(
                        provider => provider.providerId === 'password'
                    );
                    if (hasPasswordProvider) {
                        await googleAuthUser.updatePassword(senha);
                        credential = { user: googleAuthUser };
                    } else {
                        credential = await googleAuthUser.linkWithCredential(
                            firebase.auth.EmailAuthProvider.credential(email, senha)
                        );
                    }
                } else {
                    credential = await firebase.auth().createUserWithEmailAndPassword(email, senha);
                }
                const novoUsuarioRef = database.ref('usuarios').push();
                const novoUsuario = {
                    authUid: credential.user.uid,
                    email,
                    nome_completo,
                    nome_usuario,
                    foto_perfil: foto_url,
                    criadoEm: firebase.database.ServerValue.TIMESTAMP,
                    privacyConsent: {
                        version: PoefoAuthProfile.PRIVACY_POLICY_VERSION,
                        acceptedAt: firebase.database.ServerValue.TIMESTAMP,
                        source: 'signup'
                    }
                };

                try {
                    await novoUsuarioRef.set(novoUsuario);
                } catch (databaseError) {
                    if (!isGoogleSignup) {
                        try {
                            await credential.user.delete();
                        } catch (rollbackError) {
                            console.error('Não foi possível desfazer a conta Auth após falha ao salvar o perfil:', rollbackError);
                        }
                    }
                    throw databaseError;
                }
                
                // Sucesso
                const profile = await PoefoAuthProfile.attachAuthUser({ id: novoUsuarioRef.key, data: novoUsuario }, credential.user);
                sessionStorage.removeItem(privacyConsentStorageKey);
                PoefoAuthProfile.saveSession(profile, credential.user);
                if (isGoogleSignup) sessionStorage.removeItem(googleSignupStorageKey);
                feedback.textContent = `✅ Sucesso! Perfil ${nome_usuario} criado. Redirecionando...`;
                setTimeout(() => {
                    const permissionsKey = `poefoPermissionsSetup_v1_${credential.user.uid}`;
                    window.location.href = localStorage.getItem(permissionsKey) === 'done'
                        ? '/carregando'
                        : '/permissoes?next=%2Fcarregando';
                }, 800);

            } catch (error) {
                console.error("Erro no cadastro:", error);
                feedback.textContent = `❌ Erro ao processar o cadastro: ${error.message}.`;
                btnCadastro.disabled = false;
            }
        });
    </script>
</body>
</html>
