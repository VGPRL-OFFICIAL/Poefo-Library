<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Poefo</title>
    <link rel="icon" href="../images/Logo_Poefo.png" type="image/png">
   
     <link rel="stylesheet" href="../style/style_feed.css">
      <link rel="stylesheet" href="../style/style_home.css">
    <link rel="stylesheet" href="../style/style_theme.css">
    <script src="../scripts/theme.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-section">
                <img src="../images/Logo_Poefo.png" alt="Logo" class="logo">
                <span class="app-title">Poefo Libraly</span>
            </div>
            <nav class="nav-menu">
                <a href="/inicio" class="nav-link">Início</a>
                <a href="/jogos" class="nav-link">Games</a>
                <a href="/feed" class="nav-link active">Feed</a>
                <a href="/criar" class="nav-link">Criar</a>
                <a href="/perfil" class="nav-link">Conta</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar-custom">
                <a href="/inicio" class="mobile-app-brand" aria-label="Ir para o início">
                    <img src="../images/Logo_Poefo.png" alt="Poefo Library" class="mobile-app-icon">
                </a>
                <div class="search-input-wrapper">
                    <img src="../images/search.png" alt="Buscar" class="search-ic">
                    <input type="text" id="search-input-mobile" placeholder="Buscar no Poefo" autocomplete="off">
                </div>
                <h1 class="page-header-title">Feed</h1>
                <div class="header-actions">
                    <button class="filter-btn" type="button" title="Mostrar apenas seguidos" id="feed-filter-btn" aria-label="Mostrar apenas seguidos">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                        <span>Seguindo</span>
                    </button>
                    <a href="/perfil" class="user-avatar-link">
                        <img src="../images/user_ic.png" alt="Perfil" class="avatar" id="mobile-profile-pic">
                    </a>
                </div>
            </header>

            <div class="container">
                <div class="feed">
                  
                    <div id="no-results-message" class="loading-message hidden">
                        <i class="fa-solid fa-exclamation-circle mr-2"></i> Nenhum resultado encontrado.
                    </div>

                    <div id="feed-container">
                        <div id="loading-message" class="loading-message">
                            <i class="fa-solid fa-spinner fa-spin mr-2"></i> Carregando Feed...
                        </div>
                        <div id="error-message" class="error-message hidden">
                            <i class="fa-solid fa-triangle-exclamation mr-2"></i> Erro ao carregar o Feed.
                        </div>
                    </div>
                </div>

                <div class="right-sidebar">
                    <div class="trends-control">
                        <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                            <input type="checkbox" id="follow-filter-checkbox"> Mostrar apenas seguidos
                        </label>
                    </div>
                    <div class="trends-box">
                        <h3>O que está acontecendo</h3>
                        <div class="trend-item"><span class="trend-category">...</span>
                            <p class="font-bold">carregando...</p><span class="trend-posts">0 curtidas</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <a href="/publicar" class="fab" title="Criar Post">
       
        <img src="../images/ic_add.png" class="fab_icon" alt="Adicionar">
    </a>

    <nav class="mobile-nav">
            <a href="/inicio" class="nav-item"><img src="../images/ic_home.png"></a>
            <a href="/feed" class="nav-item active"><img src="../images/ic_cloud_off_white.png"></a>
            <a href="/criar" class="nav-item"><img src="../images/ic_edition.png"></a>
            <a href="/perfil" class="nav-item"><img src="../images/user_ic.png"></a>
        </nav>

    <div class="home-indicator"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="../scripts/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>

    <script>
        if (!firebase.apps.length) {
            firebase.initializeApp(window.POEFO_FIREBASE_CONFIG);
        }

        const storage = firebase.storage();
        const db = firebase.database();
    </script>
    <script src="../scripts/script_feed.js"></script>

</body>

</html>
