<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Poefo</title>
    <link rel="icon" href="../images/Logo_Poefo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="../style/style_perfil.css"> 
    <link rel="stylesheet" href="../style/style_theme.css">
    <script src="../scripts/theme.js"></script>
    
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="../scripts/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
</head>
<body>

    
    <div id="custom-modal" class="custom-modal">
        <div class="modal-content">
            <p id="modal-message"></p>
            <button id="modal-ok-btn" class="botao-acao-modal">OK</button>
        </div>
    </div>

    <div class="app-screen">
        
        <header class="app-top-bar">
            <a href="/inicio" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        </header>

        <div class="perfil-card-container">
            
            <section class="perfil-header-block">
                <div class="foto-perfil-wrapper"> 
                    <div class="foto-perfil">
                        <img id="profile-pic" src="../images/icon_logo.png" alt="Foto de Perfil do Usuário">
                        <input type="file" id="foto-perfil-upload" accept="image/*" style="display: none;">
                        <button id="btn-change-photo" class="editar-foto-btn" title="Alterar Foto" style="display:none;"><i class="fas fa-camera"></i></button>
                    </div>
                </div>
                
                <div class="info-usuario-bloco">
                    <h1 class="display-nome" id="display-nome-completo">Carregando Nome...</h1>
                    <input type="text" id="edit-nome-completo" class="edit-input" style="display:none;">
                    
                    <p class="display-username" id="display-username">@carregando...</p>
                    
                    <p class="display-localizacao"><i class="fas fa-map-marker-alt"></i> <span id="display-bio">Carregando Biografia...</span></p>
                    <textarea id="edit-bio" class="edit-textarea" style="display:none;"></textarea>
                </div>
            </section>

            
            <section class="estatisticas-container">
                <div class="stat-box">
                    <span class="stat-numero" id="stat-seguidores">0</span>
                    <span class="stat-label">Seguidores</span>
                </div>
                <div class="stat-box">
                    <span class="stat-numero" id="stat-following">0</span>
                    <span class="stat-label">Seguindo</span>
                </div>
                <div class="stat-box">
                    <span class="stat-numero" id="stat-posts">0</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat-box">
                    <span class="stat-numero" id="stat-likes">0</span>
                    <span class="stat-label">Curtidas</span>
                </div>
            </section>

            <section class="botoes-acao-wrapper">
                <button id="btn-editar-salvar" class="btn-gradiente btn-follow">Editar Perfil</button>
                <button id="btn-logout" class="btn-gradiente btn-message">Sair</button>
            </section>

            <section class="perfil-progress-section" aria-label="Seu progresso de leitura">
                <div class="perfil-progress-heading">
                    <span class="perfil-progress-eyebrow">SUA JORNADA</span>
                    <h2>Progresso de leitura</h2>
                </div>
                <div class="perfil-progress-grid">
                    <article class="perfil-progress-card perfil-progress-card--time">
                        <span class="perfil-progress-icon" aria-hidden="true"><i class="fas fa-book-open"></i></span>
                        <div class="perfil-progress-copy">
                            <span class="perfil-progress-label">Tempo de leitura</span>
                            <strong class="perfil-progress-value" id="stat-hours">0 min</strong>
                            <span class="perfil-progress-note">Tempo total na sua conta</span>
                        </div>
                    </article>
                    <article class="perfil-progress-card perfil-progress-card--score">
                        <span class="perfil-progress-icon" aria-hidden="true"><i class="fas fa-star"></i></span>
                        <div class="perfil-progress-copy">
                            <span class="perfil-progress-label">Pontos acumulados</span>
                            <strong class="perfil-progress-value" id="stat-score">0</strong>
                            <span class="perfil-progress-note">Sua evolução no Poefo</span>
                        </div>
                    </article>
                </div>
            </section>

            
            <nav class="nav-abas-perfil">
                <a href="#" class="aba-item ativo" data-tab="posts">Photo</a>
                <a href="#" class="aba-item" data-tab="anexos">Video</a>
            </nav>
            
            
            <main class="grid-galeria-posts" id="grid-posts-container">
                
                <div class="post-item placeholder" id="posts-placeholder">
                    <span>Nenhum Post Encontrado</span>
                </div>
            </main>
        </div>
    </div>

<script>
    // URL estática para os posts
    const POSTS_JSON_URL = 'https://firebasestorage.googleapis.com/v0/b/captu-libraly.firebasestorage.app/o/livros_json%2Fposts.json?alt=media&token=e7b7b6fb-275a-45e3-9482-7830189c671f';

    // === CONFIGURAÇÃO DO FIREBASE ===
    if (!firebase.apps.length) firebase.initializeApp(window.POEFO_FIREBASE_CONFIG);
    const database = firebase.database();
    window.db = database;
    const storage = firebase.storage();
    window.storage = storage;
    const PROFILE_IMAGES_FOLDER = "captu-libraly/profile_images/";
    const DEFAULT_PROFILE_PIC = 'https://firebasestorage.googleapis.com/v0/b/captu-libraly.appspot.com/o/default_profile.png?alt=media';

    // === VARIÁVEIS DE ESTADO E REFERÊNCIAS ===
    let isEditing = false;
    let currentUserId = sessionStorage.getItem('currentUserId') || localStorage.getItem('currentUserId');
    if (!sessionStorage.getItem('currentUserId') && currentUserId) {
        sessionStorage.setItem('currentUserId', currentUserId);
    }
    let allUserPosts = []; 

    // Elementos de Display
    const displayUsername = document.getElementById('display-username');
    const displayNomeCompleto = document.getElementById('display-nome-completo');
    const displayBio = document.getElementById('display-bio');
    const profilePic = document.getElementById('profile-pic');
    
    // Elementos de Edição
    const editNomeCompleto = document.getElementById('edit-nome-completo');
    const editBio = document.getElementById('edit-bio');
    
    // Botões
    const btnEditarSalvar = document.getElementById('btn-editar-salvar');
    const btnChangePhoto = document.getElementById('btn-change-photo');
    const inputPhotoUpload = document.getElementById('foto-perfil-upload');
    const btnLogout = document.getElementById('btn-logout');

    // Containers de Posts e Navegação
    const gridPostsContainer = document.getElementById('grid-posts-container');
    const navItems = document.querySelectorAll('.nav-abas-perfil .aba-item');
    const postsPlaceholder = document.getElementById('posts-placeholder');
    
    // Estatísticas
    const statPosts = document.getElementById('stat-posts');
    const statLikes = document.getElementById('stat-likes');
    const statSeguidores = document.getElementById('stat-seguidores');
    const statFollowing = document.getElementById('stat-following');
    const statHours = document.getElementById('stat-hours');
    const statScore = document.getElementById('stat-score');

    function countRelationships(snapshot) {
        const relationships = snapshot.val() || {};
        return Object.values(relationships).filter(isFollowing => isFollowing === true).length;
    }

    async function loadRelationshipCount(path, element) {
        try {
            const snapshot = await database.ref(path).once('value');
            element.textContent = countRelationships(snapshot).toLocaleString('pt-BR');
        } catch (error) {
            console.error(`Não foi possível carregar a contagem em ${path}:`, error);
            element.textContent = '—';
        }
    }

    function formatReadingDuration(totalSeconds) {
        const totalMinutes = Math.floor(Math.max(0, Number(totalSeconds) || 0) / 60);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        if (hours === 0) return `${minutes} min`;
        return minutes ? `${hours}h ${minutes}min` : `${hours}h`;
    }

    /**
     * Exibe um modal customizado no lugar de alert().
     */
    function showCustomMessage(message) {
        const modal = document.getElementById('custom-modal');
        const modalMessage = document.getElementById('modal-message');
        const modalBtn = document.getElementById('modal-ok-btn');

        modalMessage.textContent = message;
        modal.classList.add('active');

        modalBtn.onclick = () => {
            modal.classList.remove('active');
        };

        window.onclick = (event) => {
            if (event.target === modal) {
                modal.classList.remove('active');
            }
        };
    }

    // === FUNÇÕES DE CARREGAMENTO DE DADOS ===
    async function loadUserData() {
        if (!currentUserId) {
            showCustomMessage('Você não está logado. Redirecionando para o login...');
            window.location.href = '/login';
            return;
        }

        try {
            const userRef = database.ref(`usuarios/${currentUserId}`);
            const snapshot = await userRef.once('value');
            const userData = snapshot.val();

            if (!userData) {
                showCustomMessage('Dados do usuário não encontrados. Redirecionando para o login.');
                sessionStorage.clear();
                window.location.href = '/login';
                return;
            }

            // Exibir dados dinâmicos do Firebase nos campos novos
            displayUsername.textContent = `@${userData.nome_usuario || 'username'}`;
            displayNomeCompleto.textContent = userData.nome_completo || 'Nome do Usuário';
            displayBio.textContent = userData.bio && userData.bio.trim() !== '' ? userData.bio : 'Localização não definida';
            profilePic.src = userData.foto_perfil || DEFAULT_PROFILE_PIC;
            
            statScore.textContent = (Number(userData.pontuacao_total) || 0).toLocaleString('pt-BR');
            statHours.textContent = formatReadingDuration(userData.horas_lidas_segundos);
            await Promise.all([
                loadRelationshipCount(`followers/${currentUserId}`, statSeguidores),
                loadRelationshipCount(`follows/${currentUserId}`, statFollowing)
            ]);
            
            // Preencher inputs de edição
            editNomeCompleto.value = userData.nome_completo || '';
            editBio.value = userData.bio || '';

            // Carregar posts e exibir a aba padrão
            await fetchUserPosts();
            handleTabSwitch('posts'); 
            
        } catch (error) {
            console.error("Erro ao carregar dados do usuário:", error);
            showCustomMessage("Erro ao carregar seu perfil. Tente novamente.");
        }
    }

    async function fetchUserPosts() {
        if (!currentUserId) return;

        try {
            const response = await fetch(POSTS_JSON_URL);
            if (!response.ok) {
                throw new Error(`Erro ao buscar posts: ${response.statusText}`);
            }
            const postsData = await response.json();

            allUserPosts = Object.values(postsData).filter(post => {
                if (!post) return false;
                if (post.userId && String(post.userId) === String(currentUserId)) return true;
                if (post.author && post.author.userId && String(post.author.userId) === String(currentUserId)) return true;
                if (post.autor && post.autor.userId && String(post.autor.userId) === String(currentUserId)) return true;
                if (post.user && String(post.user) === String(currentUserId)) return true;
                return false;
            });
            
            // Atualiza as chaves reais de contagem de Posts e Likes (Preenchendo "Following")
            statPosts.textContent = allUserPosts.length;
            const totalLikes = allUserPosts.reduce((sum, post) => sum + (post.likes || 0), 0);
            statLikes.textContent = totalLikes; // Vinculado dinamicamente ao container 'Following'

        } catch (error) {
            console.error("Erro ao carregar posts do usuário:", error);
            showCustomMessage("Erro ao carregar postagens.");
            allUserPosts = [];
        }
    }

    function renderPosts(postsToRender) {
        gridPostsContainer.innerHTML = ''; 

        if (postsToRender.length === 0) {
            postsPlaceholder.style.display = 'flex';
            gridPostsContainer.appendChild(postsPlaceholder);
            postsPlaceholder.querySelector('span').textContent = 'Nenhuma imagem ou post encontrado.';
            return;
        }

        postsPlaceholder.style.display = 'none'; 

        postsToRender.forEach(post => {
            const postItem = document.createElement('div');
            postItem.className = 'post-card-item';

            const imgUrl = (post.anexo_url && post.anexo_url.startsWith('http') && post.anexo_url)
                || (post.imagem_url && post.imagem_url.startsWith('http') && post.imagem_url)
                || (post.attachment && post.attachment.url && post.attachment.url.startsWith('http') && post.attachment.url)
                || (post.anexo && post.anexo.url && post.anexo.url.startsWith('http') && post.anexo.url)
                || (post.imagem && post.imagem.startsWith && post.imagem.startsWith('http') && post.imagem)
                || null;

            let content;
            if (imgUrl) {
                content = `<img src="${imgUrl}" alt="Mídia do Post" class="post-img-content">`;
            } else {
                const text = post.content || post.conteudo || post.conteúdo || post.texto || post.titulo || '';
                const snippet = (text || 'Post sem conteúdo.').substring(0, 100);
                content = `<div class="post-text-card">${snippet}</div>`;
            }

            postItem.innerHTML = content;
            gridPostsContainer.appendChild(postItem);
        });
    }

    function handleTabSwitch(tabName) {
        navItems.forEach(item => {
            item.classList.remove('ativo');
            if (item.getAttribute('data-tab') === tabName) {
                item.classList.add('ativo');
            }
        });

        let postsToRender = [];
        if (tabName === 'posts') {
            postsToRender = allUserPosts;
        } else if (tabName === 'anexos') {
            postsToRender = allUserPosts.filter(post => post.anexo_url && post.anexo_url.startsWith('http'));
        }

        renderPosts(postsToRender);
    }

    // === FUNÇÕES DE EDIÇÃO E SALVAMENTO ===
    function toggleEditMode(isSaving = false) {
        if (isSaving) {
            isEditing = false; 
            btnEditarSalvar.textContent = 'Editar Perfil'; 
            btnChangePhoto.style.display = 'none';
            displayNomeCompleto.style.display = 'block';
            editNomeCompleto.style.display = 'none';
            displayBio.style.display = 'block';
            editBio.style.display = 'none';
        } else {
            isEditing = !isEditing;
            if (isEditing) {
                btnEditarSalvar.textContent = 'Salvar Alterações';
                btnChangePhoto.style.display = 'flex';
                displayNomeCompleto.style.display = 'none';
                editNomeCompleto.style.display = 'block';
                displayBio.style.display = 'none';
                editBio.style.display = 'block';
            } else {
                btnEditarSalvar.textContent = 'Editar Perfil';
                btnChangePhoto.style.display = 'none';
                displayNomeCompleto.style.display = 'block';
                editNomeCompleto.style.display = 'none';
                displayBio.style.display = 'block';
                editBio.style.display = 'none';
            }
        }
    }

    async function saveProfileData() {
        const novoNomeCompleto = editNomeCompleto.value.trim();
        const novaBio = editBio.value.trim();

        if (novoNomeCompleto === '') {
             showCustomMessage('O Nome Completo não pode estar vazio.');
             return;
        }

        try {
            const updates = {
                nome_completo: novoNomeCompleto,
                bio: novaBio
            };

            await database.ref(`usuarios/${currentUserId}`).update(updates);
            showCustomMessage('Perfil atualizado com sucesso!');
            
            displayNomeCompleto.textContent = novoNomeCompleto;
            displayBio.textContent = novaBio;
            
            toggleEditMode(true); 
        } catch (error) {
            console.error("Erro ao salvar dados do perfil:", error);
            showCustomMessage("Erro ao salvar as alterações. Tente novamente.");
        }
    }

    async function handlePhotoUpload(file) {
        if (!file) return;
        try {
            const fileExtension = file.name.split('.').pop();
            const fileName = `${currentUserId}_${Date.now()}.${fileExtension}`;
            const imageRef = storage.ref(`${PROFILE_IMAGES_FOLDER}${fileName}`); 

            const uploadTask = imageRef.put(file);
            
            uploadTask.on('state_changed', 
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    btnEditarSalvar.textContent = `Carregando... ${Math.round(progress)}%`;
                    btnEditarSalvar.disabled = true;
                }, 
                (error) => {
                    btnEditarSalvar.disabled = false;
                    showCustomMessage(`Erro no upload: ${error.message}`);
                }, 
                async () => {
                    const downloadURL = await imageRef.getDownloadURL();
                    await database.ref(`usuarios/${currentUserId}`).update({
                        foto_perfil: downloadURL
                    });

                    profilePic.src = downloadURL;
                    showCustomMessage('Foto de perfil atualizada com sucesso!');
                    btnEditarSalvar.textContent = 'Salvar Alterações'; 
                    btnEditarSalvar.disabled = false;
                }
            );
        } catch (error) {
            console.error("Erro no upload da foto:", error);
            btnEditarSalvar.disabled = false;
        }
    }
    
    async function handleLogout(e) {
        e.preventDefault();
        try {
            await firebase.auth().signOut();
            sessionStorage.clear();
            ['currentUserId', 'currentUserName', 'currentUserPic', 'currentUserAvatar', 'currentUserAuthUid', 'rememberedUsername']
                .forEach(key => localStorage.removeItem(key));
            window.location.href = '/login';
        } catch (error) {
            console.error('Erro ao sair da conta:', error);
            showCustomMessage(`Não foi possível encerrar a sessão: ${error.message}`);
        }
    }

    // === LISTENERS ===
    document.addEventListener('DOMContentLoaded', () => {
        loadUserData();
        
        btnEditarSalvar.addEventListener('click', () => {
            if (isEditing) {
                saveProfileData();
            } else {
                toggleEditMode();
            }
        });

        btnChangePhoto.addEventListener('click', () => {
            inputPhotoUpload.click();
        });

        inputPhotoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handlePhotoUpload(file);
        });

        btnLogout.addEventListener('click', handleLogout);

        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                handleTabSwitch(item.getAttribute('data-tab'));
            });
        });
    });
</script>
<script src="../scripts/script_perfil_actions.js"></script>
</body>
</html>
