<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poefo Games - Versos</title>
    <link rel="icon" href="../images/Logo_Poefo.png">
    <link rel="stylesheet" href="../style/style_home.css">
    <link rel="stylesheet" href="../style/style_theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../scripts/theme.js"></script>
    <style>
        :root {
            --ink: #2b1712;
            --accent: #c85a32;
            --accent-soft: #f4a261;
            --paper: #f9f6f0;
            --card-bg: #fff;
            --mint: #ffe8d6;
            --border-ui: #e8d0c3;
            --error: #d9534f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .shell {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-ui);
            border-radius: 24px;
            padding: clamp(22px, 5vw, 52px);
            box-shadow: 14px 16px 0 #eddcd2;
            position: relative;
        }

        .btn-voltar {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: var(--ink);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-weight: 700;
            text-decoration: none;
        }

        .eyebrow {
            display: block;
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .shell h1 {
            font: 700 clamp(40px, 7vw, 74px)/.95 Georgia, serif;
            margin: 12px 0;
            color: var(--ink);
        }

        .intro {
            color: #6d5952;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-bottom: 12px;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: #b04b27;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--error);
            border: 1px solid var(--error);
        }

        .btn-danger:hover {
            background: #fff5f5;
        }

        .btn-votar {
            padding: 14px 22px;
            border: 1px solid var(--accent);
            border-radius: 12px;
            background: transparent;
            color: var(--accent);
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            width: 100%;
            justify-content: center;
        }

        .btn-votar:hover {
            background: var(--mint);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 800;
            background: #fdf0e7;
            border: 1px solid var(--border-ui);
            padding: 10px 14px;
            border-radius: 12px;
        }

        .hint-box {
            background: #fffaf7;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid var(--border-ui);
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--ink);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--border-ui);
            border-radius: 12px;
            outline: none;
            background: #fffaf7;
            font-family: inherit;
            color: var(--ink);
            font-size: 1rem;
        }

        input:focus {
            border-color: var(--accent);
        }

        .ranking-container {
            max-height: 220px;
            overflow-y: auto;
            border-top: 1px solid var(--border-ui);
            padding-top: 15px;
            margin-bottom: 20px;
        }

        .ranking-item {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-ui);
            background: #fffaf7;
            margin-bottom: 8px;
            text-align: left;
        }

        .ranking-item.top-match {
            background: var(--mint);
            border-color: var(--accent-soft);
        }

        .progress-bar {
            height: 6px;
            background: #eddcd2;
            width: 100%;
            margin-top: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .score-display {
            font-size: 2.8rem;
            font-family: Georgia, serif;
            font-weight: bold;
            color: var(--accent);
            margin: 15px 0;
        }

        .records {
            font-size: 0.85rem;
            color: #6d5952;
            margin-top: 20px;
            text-align: left;
            border-top: 1px solid var(--border-ui);
            padding-top: 15px;
        }

        .actions-bar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        @media(max-width:600px) {
            .shell {
                margin: 20px 16px;
            }
            .input-group {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="../style/style_game_nav.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-section">
                <img src="../images/Logo_Poefo.png" class="logo" alt="Logo">
                <span class="app-title">Poefo Library</span>
            </div>
            <nav class="nav-menu">
                <a href="/inicio" class="nav-link">Início</a>
                <a href="/jogos" class="nav-link active">Games</a>
                <a href="/feed" class="nav-link">Feed</a>
            </nav>
        </aside>

        <main class="main-content">
            <a href="/jogos" class="game-menu-back"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar ao menu</a>
            <section class="shell">
                <!-- TELA: MENU -->
                <div id="menu-screen" class="screen active">
                    <h1>Versos</h1>
                    <p class="intro">Escolha o rigor da sua investigação e descubra a palavra secreta:</p>
                    
                    <button class="btn" onclick="initGame('facil')">NÍVEL FÁCIL</button>
                    <button class="btn" onclick="initGame('medio')">NÍVEL MÉDIO</button>
                    <button class="btn" onclick="initGame('dificil')">NÍVEL DIFÍCIL</button>

                    <div class="records" id="high-scores">
                        <strong>MELHORES PONTUAÇÕES:</strong><br>
                        Fácil: <span id="record-facil">0</span> | Médio: <span id="record-medio">0</span> | Difícil: <span id="record-dificil">0</span>
                    </div>

                    <div class="actions-bar">
                        <button class="btn-votar" onclick="votarJogo()"><i class="fas fa-heart"></i> Votar no Jogo</button>
                    </div>
                </div>

                <!-- TELA: JOGO -->
                <div id="game-screen" class="screen">
                    <div class="status-bar">
                        <span id="diff-label"></span>
                        <span id="tries-label"></span>
                    </div>

                    <div class="hint-box" id="hint-area">
                        <strong style="color: var(--accent);">Pista:</strong> <span id="hint-text">...</span>
                    </div>

                    <div class="input-group">
                        <input type="text" id="guess-input" placeholder="Tente uma palavra..." autocomplete="off">
                        <button class="btn" style="width: auto; margin: 0;" onclick="handleGuess()">Investigar</button>
                    </div>

                    <div class="ranking-container" id="ranking-list"></div>

                    <button class="btn btn-danger" onclick="giveUp()">Desistir desta obra</button>
                </div>

                <!-- TELA: RESULTADO -->
                <div id="result-screen" class="screen" style="text-align: center;">
                    <h1 id="result-title">Vitória</h1>
                    <div class="score-display" id="final-score-val">0</div>
                    <p id="result-desc" style="font-style: italic; margin-bottom: 20px; color: #6d5952;"></p>
                    <div id="stats-detail" style="font-size: 0.95rem; color: var(--ink); margin-bottom: 25px;"></div>
                    
                    <button class="btn" onclick="showMenu()">Nova Edição</button>
                    <button class="btn btn-danger" onclick="window.location.href='/jogos'">Sair para o Menu</button>
                </div>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="../scripts/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../scripts/script_progress.js"></script>
    <script>
        const wordDatabase = [
            { w: "biblioteca", h: "O santuário onde o silêncio guarda vozes impressas.", d: 1000 },
            { w: "manuscrito", h: "Um texto original, muitas vezes escrito à mão antes da prensa.", d: 1200 },
            { w: "metáfora", h: "Uma ponte invisível entre dois significados distintos.", d: 1500 },
            { w: "personagem", h: "A alma fictícia que caminha pelas linhas do autor.", d: 800 },
            { w: "antologia", h: "Um jardim onde florescem diversos autores em um só volume.", d: 1800 },
            { w: "pergaminho", h: "A pele do passado que carregava as leis e as artes.", d: 1400 },
            { w: "pseudonimo", h: "A máscara de letras que um autor usa para se esconder.", d: 1600 },
            { w: "soneto", h: "Quatorze versos que aprisionam um sentimento.", d: 1100 },
            { w: "epilogo", h: "As últimas palavras após o fim da tempestade.", d: 900 },
            { w: "cronica", h: "O retrato do cotidiano capturado em palavras.", d: 700 }
        ];

        let gameState = {};
        const records = { facil: 0, medio: 0, dificil: 0 };

        function normalize(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showMenu() { 
            updateRecordsUI();
            showScreen('menu-screen'); 
        }

        function updateRecordsUI() {
            records.facil = localStorage.getItem('versos_facil') || 0;
            records.medio = localStorage.getItem('versos_medio') || 0;
            records.dificil = localStorage.getItem('versos_dificil') || 0;
            
            document.getElementById('record-facil').innerText = records.facil;
            document.getElementById('record-medio').innerText = records.medio;
            document.getElementById('record-dificil').innerText = records.dificil;
        }

        function initGame(diff) {
            const randomWord = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
            gameState = {
                wordObj: randomWord,
                difficulty: diff,
                tries: 0,
                maxTries: diff === 'dificil' ? 5 : Infinity,
                guesses: [],
                hintRevealed: diff === 'facil' || diff === 'dificil'
            };

            document.getElementById('diff-label').innerText = "NÍVEL: " + diff.toUpperCase();
            document.getElementById('hint-text').innerText = gameState.hintRevealed ? randomWord.h : "A pista será revelada em breve...";
            updateTriesUI();
            document.getElementById('ranking-list').innerHTML = "";
            document.getElementById('guess-input').value = "";
            showScreen('game-screen');
        }

        function getSimilarity(input, secret) {
            if (input === secret) return 1000;
            const s1 = new Set(input);
            const s2 = new Set(secret);
            let common = 0;
            s1.forEach(l => { if(s2.has(l)) common++; });
            let score = (common / secret.length) * 500 + (input.length === secret.length ? 150 : 0);
            return Math.min(999, Math.floor(score + (Math.random() * 30)));
        }

        function handleGuess() {
            const inputField = document.getElementById('guess-input');
            const rawValue = inputField.value;
            const cleanValue = normalize(rawValue);
            const cleanSecret = normalize(gameState.wordObj.w);

            if (!cleanValue) return;
            if (gameState.guesses.some(g => normalize(g.word) === cleanValue)) {
                inputField.value = "";
                return;
            }

            gameState.tries++;
            const score = getSimilarity(cleanValue, cleanSecret);
            gameState.guesses.push({ word: rawValue, score: score });
            gameState.guesses.sort((a, b) => b.score - a.score);

            if (gameState.difficulty === 'medio' && score > 450) {
                gameState.hintRevealed = true;
                document.getElementById('hint-text').innerText = gameState.wordObj.h;
            }

            renderRanking();
            updateTriesUI();

            if (score === 1000) return endGame('win');
            if (gameState.tries >= gameState.maxTries) return endGame('lose');

            inputField.value = "";
            inputField.focus();
        }

        function giveUp() {
            endGame('gave_up');
        }

        function updateTriesUI() {
            const label = document.getElementById('tries-label');
            label.innerText = gameState.maxTries !== Infinity ? 
                `TENTATIVAS: ${gameState.tries}/${gameState.maxTries}` : `TENTATIVAS: ${gameState.tries}`;
        }

        function renderRanking() {
            const list = document.getElementById('ranking-list');
            list.innerHTML = "";
            gameState.guesses.forEach((g) => {
                const perc = (g.score / 1000) * 100;
                const item = document.createElement('div');
                item.className = `ranking-item ${g.score > 450 ? 'top-match' : ''}`;
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; font-size:0.85rem">
                        <span><strong>${g.word}</strong></span>
                        <span>${g.score} pts</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${perc}%"></div></div>
                `;
                list.appendChild(item);
            });
        }

        function endGame(status) {
            showScreen('result-screen');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const scoreVal = document.getElementById('final-score-val');
            const detail = document.getElementById('stats-detail');

            if (status === 'win') {
                title.innerText = "Obra Concluída";
                title.style.color = "var(--ink)";
                const finalScore = Math.round(gameState.wordObj.d / gameState.tries);
                scoreVal.innerText = finalScore + " pts";
                desc.innerText = `Você desvendou: "${gameState.wordObj.w.toUpperCase()}"`;
                detail.innerText = `Eficiência: ${gameState.tries} tentativa(s).`;
                
                let currentTotal = parseInt(localStorage.getItem('poefo_versos')) || 0;
                if (finalScore > currentTotal) localStorage.setItem('poefo_versos', finalScore);
                
                if (typeof incrementUserScore === 'function') {
                    incrementUserScore(finalScore);
                } else if (typeof saveUserProgressLocalFallback === 'function') {
                    saveUserProgressLocalFallback(finalScore, 0);
                }
                
                if (finalScore > (parseInt(localStorage.getItem('versos_'+gameState.difficulty)) || 0)) {
                    localStorage.setItem('versos_'+gameState.difficulty, finalScore);
                }
            } else {
                title.innerText = status === 'gave_up' ? "Escrita Abandonada" : "Rascunho Perdido";
                title.style.color = "var(--error)";
                scoreVal.innerText = "0 pts";
                desc.innerText = `A palavra secreta era: ${gameState.wordObj.w.toUpperCase()}`;
                detail.innerText = status === 'gave_up' ? "Você decidiu desistir desta investigação." : "Suas tentativas acabaram.";
            }
        }

        function votarJogo() {
            alert('Obrigado pelo seu voto! ❤');
        }

        document.getElementById('guess-input').addEventListener('keypress', e => { if(e.key === 'Enter') handleGuess(); });
        updateRecordsUI();
    </script>
</body>

</html>
