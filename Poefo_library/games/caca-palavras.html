<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poefo Games - Caça-Palavras Literário</title>
    <link rel="icon" href="../images/Logo_Poefo.png" type="image/png">
    <link rel="stylesheet" href="../style/style_home.css">
    <link rel="stylesheet" href="../style/style_theme.css">
    <script src="../scripts/theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .game-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border: 1px solid #ececec;
            border-radius: 28px;
            padding: 32px;
            box-shadow: var(--shadow-soft);
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .meta-indicators {
            display: flex;
            gap: 12px;
        }
        .badge-indicator {
            background: #f4f7fb;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            color: #1a1a1a;
            font-size: 0.95rem;
        }
        .board-layout {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 28px;
        }
        .wordsearch-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 6px;
            background: #f8fafc;
            padding: 14px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            user-select: none;
        }
        .grid-cell {
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
        }
        .grid-cell:hover { background: #f1f5f9; }
        .grid-cell.selected { background: #e0f2fe; border-color: #7dd3fc; color: #0369a1; }
        .grid-cell.found { background: #dcfce7; border-color: #86efac; color: #166534; }
        .word-list-container {
            background: #f4f7fb;
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .word-list-container h4 { margin: 0 0 14px; font-size: 1.1rem; }
        .word-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .word-item {
            padding: 10px 14px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .word-item.found { text-decoration: line-through; background: #e8f5e9; color: #2e7d32; border-color: #c8e6c9; }
        .word-item.found::after { content: "✓"; font-weight: 700; }
        .btn-voltar {
            background: none; border: none; font-size: 1.1rem; cursor: pointer;
            color: #444; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; font-weight: 600;
        }
        .btn-next {
            width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white;
            font-weight: 700; cursor: pointer; display: none; text-align: center;
        }
        .loading-overlay {
            display: flex; justify-content: center; align-items: center; height: 300px;
            font-weight: 600; color: #666; font-size: 1.2rem;
        }
        @media (max-width: 768px) { .board-layout { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="../style/style_game_nav.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-section">
                <img src="../images/Logo_Poefo.png" alt="Logo" class="logo">
                <span class="app-title">Poefo Libraly</span>
            </div>
            <nav class="nav-menu">
                <a href="/inicio" class="nav-link">Início</a>
                <a href="/jogos" class="nav-link active">Games</a>
                <a href="/feed" class="nav-link">Feed</a>
                <a href="/criar" class="nav-link">Criar</a>
                <a href="/perfil" class="nav-link">Conta</a>
            </nav>
        </aside>

        <main class="main-content">
            <a href="/jogos" class="game-menu-back"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar ao menu</a>

            <div class="game-container">
                <div class="game-header">
                    <div>
                        <h2>Caça-Palavras Realtime</h2>
                        <p style="margin:4px 0 0; color:#666;">Fases automáticas com livros e autores obtidos via API</p>
                    </div>
                    <div class="meta-indicators">
                        <div class="badge-indicator">Fase: <span id="game-phase">1</span></div>
                        <div class="badge-indicator">Pontos: <span id="game-score">0</span></div>
                    </div>
                </div>

                <div id="loading-view" class="loading-overlay">
                    <i class="fas fa-spinner fa-spin" style="margin-right: 10px;"></i> Coletando livros da atualidade literária...
                </div>

                <div class="board-layout" id="game-layout" style="display: none;">
                    <div class="wordsearch-grid" id="board"></div>

                    <div class="word-list-container">
                        <div>
                            <h4>Palavras Ocultas</h4>
                            <ul class="word-list" id="words-ui"></ul>
                        </div>
                        <button id="next-phase-btn" class="btn-next" onclick="startNewPhase()">Próxima Fase <i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="../scripts/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../scripts/script_progress.js"></script>
    <script>
        if (!firebase.apps.length) firebase.initializeApp(window.POEFO_FIREBASE_CONFIG);
        const db = firebase.database();

        // Parâmetros de Controle das Fases
        const GRID_SIZE = 12;
        let currentPhase = 1;
        let totalScore = 0;
        let wordsToFind = [];
        let foundWords = [];
        let selectedCells = [];
        let gridMatrix = [];

        // Termos literários de segurança caso a rede falhe
        const fallbackPool = ["POESIA", "LIVRO", "VERSO", "AUTOR", "PAGINA", "PROSA", "ROMANCE", "CONTO"];

        // 1. Busca dinamicamente os livros da atualidade literária usando a API da Open Library
        async function fetchWordsFromAPI() {
            // Buscando termos populares e modernos na ficção atual
            const queryKeywords = ['bestseller', 'fiction', 'fantasy', 'thriller', 'poetry'];
            const randomKeyword = queryKeywords[Math.floor(Math.random() * queryKeywords.length)];
            
            try {
                const response = await fetch(`https://openlibrary.org/search.json?q=${randomKeyword}&limit=15&fields=title,author_name`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                let extractedWords = [];
                data.docs.forEach(doc => {
                    if (doc.title) {
                        // Limpa strings: remove acentos, espaços e caracteres especiais
                        let cleanTitle = doc.title.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Z]/g, "");
                        if (cleanTitle.length >= 3 && cleanTitle.length <= 9) extractedWords.push(cleanTitle);
                    }
                    if (doc.author_name && doc.author_name[0]) {
                        let cleanAuthor = doc.author_name[0].toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Z]/g, "");
                        if (cleanAuthor.length >= 3 && cleanAuthor.length <= 9) extractedWords.push(cleanAuthor);
                    }
                });

                // Remove duplicatas e seleciona 5 palavras únicas para a fase
                extractedWords = [...new Set(extractedWords)];
                if (extractedWords.length < 5) return getRandomFallbackWords();
                
                return extractedWords.sort(() => 0.5 - Math.random()).slice(0, 5);
            } catch (error) {
                console.warn("Falha na API externa, usando fallback literário local.");
                return getRandomFallbackWords();
            }
        }

        function getRandomFallbackWords() {
            return fallbackPool.sort(() => 0.5 - Math.random()).slice(0, 5);
        }

        // 2. Construtor de matrizes de Caça-Palavras bidimensional integrado
        function generateWordSearchMatrix(words) {
            const matrix = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));
            
            words.forEach(word => {
                let placed = false;
                let attempts = 0;
                
                while (!placed && attempts < 100) {
                    const direction = Math.random() > 0.5 ? 'H' : 'V'; // Horizontal ou Vertical
                    const row = Math.floor(Math.random() * (direction === 'V' ? (GRID_SIZE - word.length) : GRID_SIZE));
                    const col = Math.floor(Math.random() * (direction === 'H' ? (GRID_SIZE - word.length) : GRID_SIZE));
                    
                    let canPlace = true;
                    for (let i = 0; i < word.length; i++) {
                        const r = row + (direction === 'V' ? i : 0);
                        const c = col + (direction === 'H' ? i : 0);
                        if (matrix[r][c] !== '' && matrix[r][c] !== word[i]) {
                            canPlace = false;
                            break;
                        }
                    }
                    
                    if (canPlace) {
                        for (let i = 0; i < word.length; i++) {
                            const r = row + (direction === 'V' ? i : 0);
                            const c = col + (direction === 'H' ? i : 0);
                            matrix[r][c] = word[i];
                        }
                        placed = true;
                    }
                    attempts++;
                }
            });

            // Preenche os espaços vazios restantes com letras randômicas de A-Z
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (matrix[r][c] === '') {
                        matrix[r][c] = letters[Math.floor(Math.random() * letters.length)];
                    }
                }
            }
            return matrix;
        }

        // 3. Inicializador de Fluxo da Fase
        async function startNewPhase() {
            document.getElementById('loading-view').style.display = 'flex';
            document.getElementById('game-layout').style.display = 'none';
            document.getElementById('next-phase-btn').style.display = 'none';
            
            selectedCells = [];
            foundWords = [];
            
            // Renderiza indicadores textuais
            document.getElementById('game-phase').textContent = currentPhase;

            // Coleta dados assíncronos da API
            wordsToFind = await fetchWordsFromAPI();
            gridMatrix = generateWordSearchMatrix(wordsToFind);

            // Limpa elementos HTML antigos
            const board = document.getElementById('board');
            const wordsUi = document.getElementById('words-ui');
            board.innerHTML = '';
            wordsUi.innerHTML = '';

            // Constrói interface das Palavras Alvo
            wordsToFind.forEach(word => {
                const li = document.createElement('li');
                li.className = 'word-item';
                li.id = `word-${word}`;
                li.textContent = word;
                wordsUi.appendChild(li);
            });

            // Constrói interface do tabuleiro
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.textContent = gridMatrix[r][c];
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    cell.addEventListener('click', () => handleCellSelection(cell));
                    board.appendChild(cell);
                }
            }

            document.getElementById('loading-view').style.display = 'none';
            document.getElementById('game-layout').style.display = 'grid';
        }

        function handleCellSelection(cell) {
            if (cell.classList.contains('found')) return;

            if (cell.classList.contains('selected')) {
                cell.classList.remove('selected');
                selectedCells = selectedCells.filter(c => c !== cell);
            } else {
                cell.classList.add('selected');
                selectedCells.push(cell);
            }

            evalSelection();
        }

        function evalSelection() {
            const formedString = selectedCells.map(c => c.textContent).join('');
            
            if (wordsToFind.includes(formedString) && !foundWords.includes(formedString)) {
                foundWords.push(formedString);
                
                selectedCells.forEach(cell => {
                    cell.classList.remove('selected');
                    cell.classList.add('found');
                });
                
                document.getElementById(`word-${formedString}`).classList.add('found');
                selectedCells = [];

                // Envia 25 pontos por acerto direto ao perfil do usuário no Firebase
                sendScoreToProfile(25);
            }

            // Se todas as palavras da fase foram descobertas, libera o botão de avançar de fase
            if (foundWords.length === wordsToFind.length) {
                document.getElementById('next-phase-btn').style.display = 'block';
                currentPhase++;
            }
        }

        function updateScoreUI() {
            document.getElementById('game-score').textContent = totalScore;
        }

        // 4. Integração nativa com a pontuação total do Usuário no Firebase Realtime Database
        async function sendScoreToProfile(points) {
            totalScore += points;
            updateScoreUI();

            try {
                if (await incrementUserScore(points)) return;
            } catch (error) {
                console.error("Erro na sincronização de pontos com o Firebase:", error);
                await saveUserProgressLocalFallback(points, 0);
            }
        }

        async function restoreSavedScore() {
            try {
                const progress = await loadUserProgressSummary().catch(() => loadUserProgressFallback());
                totalScore = progress?.totalScore || 0;
            } catch (error) {
                console.warn('Não foi possível restaurar a pontuação salva:', error);
                totalScore = Number(localStorage.getItem('poefo_total_score')) || 0;
            }

            updateScoreUI();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await restoreSavedScore();
            await startNewPhase();
        });
    </script>
</body>
</html>
